<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#a9d8d2">
  <meta name="description" content="陪黄璐漩一路向上，去看山顶的日出。">
  <title>黄璐漩的山野日记</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #24423f; touch-action: none; overscroll-behavior: none;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    #gameCanvas {
      display: block; width: 100vw; height: 100dvh;
      width: 100%; height: 100%;
    }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #fffaf0; background: #3f685b; font-size: 15px;
      transition: opacity .25s; pointer-events: none;
    }
    .ready #loading { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" aria-label="黄璐漩的山野日记"></canvas>
  <div id="loading">正在铺好登山的小路…</div>
  <script src="js/web-shim.js?v=3"></script>
  <script src="js/main.js?v=3"></script>
</body>
</html>
